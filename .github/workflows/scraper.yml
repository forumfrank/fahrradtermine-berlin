name: Fahrradtermine Berlin scraping

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Fahrradtermine Berlin / Gancio scrapen
        run: python src/scraper_gancio.py

      - name: VELODEMO scrapen
        run: python src/scraper_velodemo.py

      - name: ADFC-Veranstaltungen scrapen
        run: python src/scraper_adfc.py

      - name: Fahrradselbsthilfewerkstätten scrapen
        run: python src/scraper_werkstaetten.py

      - name: Quelldateien zusammenführen
        run: python src/merge_candidates.py

      - name: Getrennte HedgeDoc-HTML-Dateien erzeugen
        run: python src/to_html.py
        
      # Im Workflow NACH "Getrennte HedgeDoc-HTML-Dateien erzeugen" einfügen:
      - name: Versammlungsbehörde scrapen
        run: python src/scraper_versammlungsbehoerde.py


      # In .github/workflows/scrape.yml direkt NACH dem Schritt einfügen,
      # der alle normalen Event-HTML-Dateien mit src/to_html.py erzeugt.
      # Wichtig: Dieser Schritt muss nach dem allgemeinen HTML-Konverter kommen,
      # damit dessen leere werkstaetten.html nicht mehr überschreibt.

      - name: Render Werkstätten HTML
        run: python src/render_werkstaetten.py

      # Unter deinem vorhandenen Job (z. B. jobs: -> scrape:) neben 'runs-on:' ergänzen:
      
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}  
      
      
      - name: JSON und HTML als Artefakte bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: fahrradtermine-json-und-html
          path: |
            output/candidates_gancio.json
            output/candidates_velodemo.json
            output/candidates_adfc.json
            output/candidates_werkstaetten.json
            output/candidates.json
            output/candidates_versammlungsbehoerde.json

            output/fahrradtermine.html
            output/velodemo.html
            output/adfc.html
            output/werkstaetten.html
            output/versammlungsbehoerde.html

        - name: GitHub-Pages-Dateien vorbereiten
          run: python src/prepare_github_pages.py

        - name: GitHub Pages konfigurieren
          uses: actions/configure-pages@v5

        - name: Kalender für GitHub Pages hochladen
          uses: actions/upload-pages-artifact@v4
          with:
          path: _site

        - name: Kalender auf GitHub Pages veröffentlichen
          id: deployment
          uses: actions/deploy-pages@v4

            
          if-no-files-found: error
          retention-days: 14
